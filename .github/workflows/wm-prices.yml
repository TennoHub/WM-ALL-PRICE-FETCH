name: Update WM Prices

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wm-prices-publish
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest price history
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          import urllib.request
          from datetime import datetime, timezone, timedelta

          BASE = "https://relics.run/history/"
          HEADERS = {
              "User-Agent": "Mozilla/5.0",
              "Accept": "application/json,text/html,*/*",
          }

          def download(url):
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=90) as response:
                  return response.read()

          now = datetime.now(timezone.utc)
          latest_date = None
          success = False

          try:
              html = download(BASE).decode("utf-8")

              files = re.findall(
                  r'price_history_(\d{4}-\d{2}-\d{2})\.json',
                  html
              )

              if not files:
                  raise RuntimeError("No price history files found")

              latest_date = max(files)
              filename = f"price_history_{latest_date}.json"

              print(f"Latest file: {filename}")

              data = download(BASE + filename)

              # Validate JSON before publishing
              json.loads(data)

              with open("wm_prices.json", "wb") as f:
                  f.write(data)

              file_date = datetime.strptime(
                  latest_date, "%Y-%m-%d"
              ).replace(tzinfo=timezone.utc)

              age = now - file_date

              # Less than 3 days old, not future-dated
              success = (
                  timedelta(0) <= age < timedelta(days=3)
              )

              print(f"File date: {latest_date}")
              print(f"Fresh: {success}")

          except Exception as e:
              print(f"Error: {e}")
              success = False

          stats = {
              "success": success,
              "latest_date": latest_date
          }

          with open("stats.json", "w", encoding="utf-8") as f:
              json.dump(stats, f, indent=2)
              f.write("\n")

          print(json.dumps(stats, indent=2))
          PY

      - name: Download latest relic data
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          REPO = "WFCD/warframe-drop-data"
          BRANCH = "main"
          FILE_PATH = "data/relics.json"
          API_BASE = "https://api.github.com"

          token = os.environ.get("GITHUB_TOKEN", "")

          HEADERS = {
              "User-Agent": "TennoHub-WM-Price-Fetch",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "Cache-Control": "no-cache",
              "Pragma": "no-cache",
          }

          if token:
              HEADERS["Authorization"] = f"Bearer {token}"

          def api_get(url, retries=3):
              for attempt in range(1, retries + 1):
                  try:
                      request = urllib.request.Request(
                          url,
                          headers=HEADERS
                      )

                      with urllib.request.urlopen(
                          request,
                          timeout=60
                      ) as response:
                          return json.load(response)

                  except Exception as e:
                      print(
                          f"Request failed "
                          f"(attempt {attempt}/{retries}): {e}"
                      )

                      if attempt == retries:
                          raise

                      time.sleep(5 * attempt)

          try:
              # Step 1: Resolve the latest main branch commit
              commit_url = (
                  f"{API_BASE}/repos/{REPO}/commits/{BRANCH}"
              )

              print("Fetching latest WFCD commit...")

              commit = api_get(commit_url)
              commit_sha = commit["sha"]

              if len(commit_sha) != 40:
                  raise RuntimeError(
                      f"Invalid commit SHA: {commit_sha}"
                  )

              print(f"Latest commit: {commit_sha}")

              # Step 2: Download relics.json from that exact commit
              contents_url = (
                  f"{API_BASE}/repos/{REPO}/contents/"
                  f"{FILE_PATH}?ref={commit_sha}"
              )

              print("Downloading relics.json...")

              result = api_get(contents_url)

              if result.get("type") != "file":
                  raise RuntimeError(
                      "GitHub API did not return a file"
                  )

              if result.get("encoding") != "base64":
                  raise RuntimeError(
                      "Unexpected GitHub API content encoding"
                  )

              encoded_content = result.get("content", "")

              if not encoded_content:
                  raise RuntimeError(
                      "GitHub API returned empty content"
                  )

              # Step 3: Decode the downloaded content
              data = base64.b64decode(
                  encoded_content,
                  validate=False
              )

              # Step 4: Validate JSON
              parsed = json.loads(data)

              if not isinstance(parsed, (dict, list)):
                  raise RuntimeError(
                      "Unexpected relics.json structure"
                  )

              if not parsed:
                  raise RuntimeError(
                      "relics.json is empty"
                  )

              # Step 5: Publish only validated content
              with open("relics.json", "wb") as f:
                  f.write(data)

              print("Successfully downloaded relics.json")
              print(f"Source commit: {commit_sha}")
              print(f"File size: {len(data):,} bytes")

          except Exception as e:
              print(f"::warning::Failed to update relics.json: {e}")
              print("Previous published relic data will be preserved.")
          PY

      - name: Publish to publish branch
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # Save generated files outside repository
          mkdir -p /tmp/wm-prices

          for file in stats.json wm_prices.json relics.json; do
            if [ -f "$file" ]; then
              cp "$file" /tmp/wm-prices/
            fi
          done

          # Remove generated files before checkout
          rm -f stats.json wm_prices.json relics.json

          # Fetch publish branch
          git fetch origin publish || true

          if git show-ref --verify --quiet refs/remotes/origin/publish; then
            git checkout -B publish origin/publish
          else
            git checkout --orphan publish
            git rm -rf --ignore-unmatch . || true
          fi

          # Restore generated files
          for file in stats.json wm_prices.json relics.json; do
            if [ -f "/tmp/wm-prices/$file" ]; then
              cp "/tmp/wm-prices/$file" "./$file"
              git add "$file"
            fi
          done

          # Commit only if changed
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi

          git commit -m "Update WM prices and relic data"
          git push origin publish
