name: Update WM Prices

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wm-prices-publish
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest price history
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          import urllib.request
          from datetime import datetime, timezone, timedelta

          BASE = "https://relics.run/history/"
          HEADERS = {
              "User-Agent": "Mozilla/5.0",
              "Accept": "application/json,text/html,*/*",
          }

          def download(url):
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=90) as response:
                  return response.read()

          now = datetime.now(timezone.utc)
          latest_date = None
          success = False

          try:
              html = download(BASE).decode("utf-8")

              files = re.findall(
                  r'price_history_(\d{4}-\d{2}-\d{2})\.json',
                  html
              )

              if not files:
                  raise RuntimeError("No price history files found")

              latest_date = max(files)
              filename = f"price_history_{latest_date}.json"

              print(f"Latest file: {filename}")

              data = download(BASE + filename)

              # Validate JSON before publishing
              json.loads(data)

              with open("wm_prices.json", "wb") as f:
                  f.write(data)

              file_date = datetime.strptime(
                  latest_date, "%Y-%m-%d"
              ).replace(tzinfo=timezone.utc)

              age = now - file_date

              # Less than 3 days old, not future-dated
              success = (
                  timedelta(0) <= age < timedelta(days=3)
              )

              print(f"File date: {latest_date}")
              print(f"Fresh: {success}")

          except Exception as e:
              print(f"Error: {e}")
              success = False

          stats = {
              "success": success,
              "latest_date": latest_date
          }

          with open("stats.json", "w", encoding="utf-8") as f:
              json.dump(stats, f, indent=2)
              f.write("\n")

          print(json.dumps(stats, indent=2))
          PY

      - name: Download latest relic data
        shell: bash
        run: |
          set -euo pipefail

          URL="https://raw.githubusercontent.com/WFCD/warframe-drop-data/main/data/relics.json"

          if curl -fSL \
            --retry 3 \
            --retry-delay 5 \
            --connect-timeout 15 \
            --max-time 120 \
            "$URL" \
            -o relics.json.tmp; then

            if python3 -m json.tool relics.json.tmp > /dev/null; then
              mv relics.json.tmp relics.json
              echo "Successfully downloaded relics.json"
            else
              echo "::warning::Invalid relics.json received"
              rm -f relics.json.tmp
            fi
          else
            echo "::warning::Failed to download relics.json"
            rm -f relics.json.tmp
          fi

      - name: Publish to publish branch
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # Save generated files outside repository
          mkdir -p /tmp/wm-prices

          for file in stats.json wm_prices.json relics.json; do
            if [ -f "$file" ]; then
              cp "$file" /tmp/wm-prices/
            fi
          done

          # Remove generated files before checkout
          rm -f stats.json wm_prices.json relics.json

          # Fetch publish branch
          git fetch origin publish || true

          if git show-ref --verify --quiet refs/remotes/origin/publish; then
            git checkout -B publish origin/publish
          else
            git checkout --orphan publish
            git rm -rf --ignore-unmatch . || true
          fi

          # Restore generated files
          for file in stats.json wm_prices.json relics.json; do
            if [ -f "/tmp/wm-prices/$file" ]; then
              cp "/tmp/wm-prices/$file" "./$file"
              git add "$file"
            fi
          done

          # Commit only if changed
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi

          git commit -m "Update WM prices and relic data"
          git push origin publish
